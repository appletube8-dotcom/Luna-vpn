services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - luna_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  bot:
    build: .
    command: ["python", "-m", "luna.bot"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - luna_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  luna_data:
